name: Build Conduit APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone sources
        run: |
          git clone https://github.com/gwitko/Conduit.git conduit
          cd conduit
          git checkout 9cd2ff9174e4ee8e9f0679d1da6aa4aa0edcf742
          cd ..
          git clone https://github.com/gwitko/conduit_vt.git conduit_vt
          cd conduit_vt
          git checkout b486b894ea12b18b2ad76339ccd8c6ae3c12416f

      - name: Patch conduit_vt (stop forcing secure keyboard)
        run: |
          cd conduit_vt
          sed -i 's/enableSuggestions: false/enableSuggestions: true/' lib/src/ui/custom_text_edit.dart
          sed -i 's/enableIMEPersonalizedLearning: false/enableIMEPersonalizedLearning: true/' lib/src/ui/custom_text_edit.dart
          grep -n "autocorrect\|enableSuggestions\|enableIMEPersonalizedLearning" lib/src/ui/custom_text_edit.dart

      - name: Apply Conduit modifications (no secure keyboard / no app lock)
