          git apply /tmp/conduit.diff
          grep -n "keyboardType" lib/features/terminal/presentation/widgets/terminal_surface.dart
          test ! -d lib/features/app_lock && echo "app_lock removed OK"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate signing keystore
        run: |
          cd conduit/android
          keytool -genkeypair -v -keystore app/upload-keystore.jks \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias conduit -storepass conduit123456 -keypass conduit123456 \
            -dname "CN=Conduit, OU=Self, O=Self, L=NA, ST=NA, C=NA"
          printf 'storeFile=upload-keystore.jks\nstorePassword=conduit123456\nkeyPassword=conduit123456\nkeyAlias=conduit\n' > key.properties

      - name: Build APK
        run: |
          cd conduit
          flutter pub get
          flutter build apk --release --flavor full

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: conduit-apk
          path: conduit/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
